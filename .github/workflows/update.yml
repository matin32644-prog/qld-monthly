name: update
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 미국 장 마감 뒤 (한국 06:30)
    - cron: "0 15,18 * * 1-5" # 장중 두 번
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python update.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "data" && git push)
